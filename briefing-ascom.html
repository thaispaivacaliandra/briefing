<title>Briefing ASCOM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#FFFFFF;
    --bg-sunken:#F4F7F7;
    --surface:#FFFFFF;
    --surface-2:#EFF4F4;
    --line:#DCE6E6;
    --line-soft:#E9F0F0;
    --ink:#12292B;
    --ink-soft:#5B6D6E;
    --ink-faint:#8B9C9C;
    --brand:#024248;
    --brand-deep:#02333A;
    --brand-mid:#006369;
    --brand-on:#FFFFFF;
    --accent:#00838D;
    --accent-strong:#006369;
    --accent-tint:#E3F6F6;
    --accent-tint-line:#BFEBEA;
    --success:#0E8F53;
    --success-tint:#E4F8ED;
    --success-line:#BCEBCE;
    --danger:#B4442E;
    --danger-tint:#FBECE8;
    --focus:#00838D;
    --shadow: 0 1px 2px rgba(2,66,72,.06), 0 8px 24px -12px rgba(2,66,72,.18);
    --radius-card:16px;
    --radius-btn:9px;
    --radius-tag:999px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#04191B;
      --bg-sunken:#031315;
      --surface:#0A2426;
      --surface-2:#0F2E30;
      --line:#123739;
      --line-soft:#0F2E30;
      --ink:#EAF3F3;
      --ink-soft:#9FB8B8;
      --ink-faint:#6C8788;
      --brand:#FFFFFF;
      --brand-deep:#F3FAFA;
      --brand-mid:#7FD9DB;
      --brand-on:#04191B;
      --accent:#3FD3D9;
      --accent-strong:#6BEBED;
      --accent-tint:#0D3335;
      --accent-tint-line:#164648;
      --success:#4FD98A;
      --success-tint:#0D3020;
      --success-line:#1B4A34;
      --danger:#F0937E;
      --danger-tint:#3A1712;
      --focus:#6BEBED;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#04191B;
    --bg-sunken:#031315;
    --surface:#0A2426;
    --surface-2:#0F2E30;
    --line:#123739;
    --line-soft:#0F2E30;
    --ink:#EAF3F3;
    --ink-soft:#9FB8B8;
    --ink-faint:#6C8788;
    --brand:#FFFFFF;
    --brand-deep:#F3FAFA;
    --brand-mid:#7FD9DB;
    --brand-on:#04191B;
    --accent:#3FD3D9;
    --accent-strong:#6BEBED;
    --accent-tint:#0D3335;
    --accent-tint-line:#164648;
    --success:#4FD98A;
    --success-tint:#0D3020;
    --success-line:#1B4A34;
    --danger:#F0937E;
    --danger-tint:#3A1712;
    --focus:#6BEBED;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, -apple-system, sans-serif;
    font-size:15.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{
    font-family:'Public Sans', system-ui, sans-serif;
    text-wrap:balance;
    color:var(--brand);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  a{color:var(--accent-strong);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-tint-line);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:100vh;
  }
  @media (max-width:880px){
    .app{grid-template-columns:1fr;}
    .rail{display:none;}
    .rail.rail-open{display:flex;}
  }

  /* ---------- RAIL ---------- */
  .rail{
    background:var(--brand);
    color:rgba(255,255,255,.92);
    padding:28px 22px 24px;
    display:flex;
    flex-direction:column;
    gap:26px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .rail-brand{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .rail-brand .mark{
    font-family:'Public Sans',sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#fff;
  }
  .rail-brand .sub{
    font-size:12.5px;
    color:rgba(255,255,255,.68);
  }
  .rail-sections{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .rail-sec{
    display:flex;
    gap:12px;
    padding:10px 10px;
    border-radius:11px;
    cursor:default;
    align-items:flex-start;
  }
  .rail-sec .num{
    flex:none;
    width:26px;height:26px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:rgba(255,255,255,.75);
  }
  .rail-sec.done .num{background:var(--accent-strong);border-color:var(--accent-strong);color:#03282A;}
  .rail-sec.active{background:rgba(255,255,255,.1);}
  .rail-sec.active .num{background:#fff;border-color:#fff;color:var(--brand-deep);}
  .rail-sec .txt{padding-top:2px;}
  .rail-sec .name{font-size:13.5px;font-weight:600;color:#fff;}
  .rail-sec .desc{font-size:12px;color:rgba(255,255,255,.6);margin-top:1px;}
  .rail-foot{
    margin-top:auto;
    font-size:11.5px;
    color:rgba(255,255,255,.5);
    border-top:1px solid rgba(255,255,255,.15);
    padding-top:14px;
  }
  .rail-reset{
    margin-top:8px;
    background:none;border:1px solid rgba(255,255,255,.3);
    color:rgba(255,255,255,.85);
    border-radius:var(--radius-btn);
    padding:7px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .rail-reset:hover{background:rgba(255,255,255,.1);}

  /* ---------- MAIN ---------- */
  .main{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .topbar{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:14px 28px 12px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
  }
  .topbar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .crumbs{
    display:flex;
    align-items:baseline;
    gap:9px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .crumbs .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-tint);
    border:1px solid var(--accent-tint-line);
    padding:2px 8px;
    border-radius:var(--radius-tag);
  }
  .mobile-toggle{
    display:none;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius-btn);
    padding:6px 10px;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
  }
  @media (max-width:880px){ .mobile-toggle{display:inline-flex;} }

  .stage{
    flex:1;
    display:flex;
    justify-content:center;
    padding:38px 24px 90px;
  }
  .card{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--accent-strong);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .q-title{
    font-size:23px;
    font-weight:700;
    line-height:1.28;
    margin-bottom:8px;
  }
  .q-help{
    font-size:13.8px;
    color:var(--ink-soft);
    margin-bottom:22px;
    max-width:60ch;
  }
  .note-box{
    background:var(--accent-tint);
    border:1px solid var(--accent-tint-line);
    border-radius:var(--radius-card);
    padding:14px 16px;
    font-size:13.3px;
    color:var(--ink);
    margin-bottom:18px;
  }
  .note-box b{color:var(--brand);}

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.7px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input[type=text], input[type=email], input[type=date], textarea, select{
    width:100%;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:11px;
    padding:11px 13px;
    font-size:14.5px;
    color:var(--ink);
    font-family:inherit;
    resize:vertical;
  }
  textarea{min-height:96px;}
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--focus);
    outline-offset:1px;
    border-color:var(--focus);
  }
  input::placeholder, textarea::placeholder{color:var(--ink-faint);}

  .opt-grid{display:flex;flex-direction:column;gap:9px;}
  .opt-grid.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  @media (max-width:520px){.opt-grid.grid2{grid-template-columns:1fr;}}
  .opt{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    cursor:pointer;
    background:var(--surface);
    font-size:14.3px;
    color:var(--ink);
    transition:border-color .12s, background .12s;
  }
  .opt:hover{border-color:var(--accent);}
  .opt .dot{
    flex:none;width:18px;height:18px;border-radius:999px;
    border:1.5px solid var(--ink-faint);
    display:flex;align-items:center;justify-content:center;
  }
  .opt.checkbox .dot{border-radius:6px;}
  .opt .dot i{width:9px;height:9px;border-radius:999px;background:var(--accent-strong);display:none;}
  .opt.checkbox .dot i{border-radius:2px;}
  .opt.selected{border-color:var(--accent-strong);background:var(--accent-tint);}
  .opt.selected .dot{border-color:var(--accent-strong);}
  .opt.selected .dot i{display:block;}

  .other-row{margin-top:2px;}

  .dyn-list{display:flex;flex-direction:column;gap:12px;margin-bottom:6px;}
  .dyn-row{
    border:1.5px solid var(--line);
    border-radius:13px;
    padding:14px;
    position:relative;
    background:var(--bg-sunken);
  }
  .dyn-row .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.dyn-row .grid{grid-template-columns:1fr;}}
  .dyn-remove{
    position:absolute;top:10px;right:10px;
    background:none;border:none;color:var(--ink-faint);
    cursor:pointer;font-size:16px;line-height:1;padding:4px;
  }
  .dyn-remove:hover{color:var(--danger);}
  .add-row{
    align-self:flex-start;
    background:var(--surface-2);
    border:1.5px dashed var(--line);
    color:var(--accent-strong);
    border-radius:11px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:16px;
  }
  .add-row:hover{border-color:var(--accent);}

  .upload-zone{
    border:1.5px dashed var(--line);
    border-radius:var(--radius-card);
    background:var(--bg-sunken);
    padding:26px 18px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.3px;
    margin-bottom:18px;
  }
  .upload-zone .ic{font-size:22px;display:block;margin-bottom:6px;}
  .upload-zone .proto{
    display:inline-block;margin-top:10px;
    font-size:11.5px;font-weight:600;
    color:var(--ink-faint);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:3px 9px;border-radius:var(--radius-tag);
  }

  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:26px;
    gap:12px;
  }
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border-radius:var(--radius-btn);
    padding:11px 20px;
    cursor:pointer;
    border:1.5px solid transparent;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--brand);color:var(--brand-on);}
  .btn-primary:hover{background:var(--brand-deep);}
  .btn-ghost{background:none;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .err-msg{
    font-size:12.5px;color:var(--danger);margin-top:8px;
    display:none;
  }
  .err-msg.show{display:block;}

  /* ---------- REVIEW ---------- */
  .review-head{margin-bottom:22px;}
  .rev-sec{margin-bottom:26px;}
  .rev-sec h3{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--brand);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:12px;
  }
  .rev-item{
    display:grid;
    grid-template-columns:88px 1fr;
    gap:14px;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:13.6px;
  }
  .rev-item .id{font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);font-size:11.5px;padding-top:2px;}
  .rev-item .q{color:var(--ink-soft);margin-bottom:2px;}
  .rev-item .a{color:var(--ink);font-weight:500;white-space:pre-wrap;}
  .rev-item .a.empty{color:var(--ink-faint);font-weight:400;font-style:italic;}
  .rev-edit{
    margin-top:20px;
    display:inline-flex;
    font-size:12px;font-weight:600;
    color:var(--accent-strong);
    background:none;border:none;cursor:pointer;
    padding:0;
  }

  .confirm{
    background:var(--success-tint);
    border:1px solid var(--success-line);
    border-radius:var(--radius-card);
    padding:22px 22px;
    margin-top:8px;
  }
  .confirm .ic{font-size:26px;}
  .confirm h3{color:var(--success);font-size:17px;margin:10px 0 6px;}
  .confirm p{font-size:13.8px;color:var(--ink);margin:0;}

  .progress-strip{
    display:flex;gap:4px;margin-bottom:26px;
  }
  .progress-strip i{
    height:4px;flex:1;border-radius:99px;background:var(--line);
  }
  .progress-strip i.on{background:var(--accent-strong);}

  /* ---------- TIME ESTIMATE / PROGRESS ---------- */
  .time-estimate{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
    flex:none;
  }
  .time-estimate svg{flex:none;color:var(--accent-strong);}
  .progress-track{
    height:4px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent-strong);
    border-radius:99px;
    transition:width .35s ease;
  }
  @media (prefers-reduced-motion: reduce){ .progress-fill{transition:none;} }

  /* ---------- ACCUMULATING FLOW ---------- */
  .qa-card{
    background:var(--bg-sunken);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:15px 18px;
  }
  .qa-card-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:12px;
    margin-bottom:6px;
  }
  .qa-card-q{
    font-size:13.6px;
    font-weight:600;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .qa-num{
    color:var(--accent-strong);
    font-size:11px;
    font-weight:600;
    margin-right:8px;
  }
  .qa-edit{
    flex:none;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:var(--radius-tag);
    padding:4px 11px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
  }
  .qa-edit:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-tint);}
  .qa-a{
    font-size:14.3px;
    color:var(--ink);
    font-weight:500;
    white-space:pre-wrap;
  }
  .qa-a.empty{color:var(--ink-faint);font-weight:400;font-style:italic;}
  .qa-note{
    background:var(--accent-tint);
    border:1px solid var(--accent-tint-line);
    border-radius:var(--radius-card);
    padding:12px 16px;
    font-size:12.8px;
    color:var(--ink-soft);
  }
  .qa-note b{color:var(--brand);}
  .qa-active{
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow);
    padding:28px 28px 26px;
    scroll-margin-top:110px;
  }
</style>

<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="mark">Enap · ASCOM/CGCO</div>
      <div class="sub">Briefing de Comunicação Institucional</div>
    </div>
    <nav class="rail-sections" id="railSections"></nav>
    <div class="rail-foot">
      Fluxo com lógica condicional — perguntas irrelevantes para o seu caso são puladas automaticamente, como no formulário original.
      <br><button class="rail-reset" id="resetBtn" type="button">Reiniciar fluxo</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-top">
        <div class="crumbs">
          <button class="mobile-toggle" id="mobileToggle" type="button">Seções</button>
          <span id="crumbSection">Seção 1</span>
          <span class="badge" id="crumbBadge">—</span>
        </div>
        <div class="time-estimate">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <span id="timeEstimate">calculando…</span>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="stage">
      <div class="card" id="card"></div>
    </div>
  </div>
</div>

<script>
(function(){

  var GROUPS = [
    {name:'Presidência', areas:['Assessoria','Auditoria','Corregedoria','Ouvidoria','Procuradoria','Coordenação-Geral de Imagem Institucional','Coordenação-Geral de Comunicação Institucional']},
    {name:'Diretoria Executiva', areas:['Coordenação-Geral de Articulação Institucional','Coordenação-Geral de Estratégia Institucional','Coordenação-Geral de Governança Institucional']},
    {name:'Diretoria de Gestão Corporativa', areas:['Coordenação-Geral de Logística e Contratos','Coordenação-Geral de Orçamento e Finanças','Coordenação-Geral de Gestão de Pessoas','Coordenação-Geral de Tecnologia da Informação','Coordenação-Geral de Parcerias Colaborativas']},
    {name:'Diretoria de Altos Estudos', areas:['Coordenação-Geral de Pesquisa','Coordenação-Geral de Ciências de Dados','Coordenação-Geral de Avaliação e Organização de Evidências']},
    {name:'Diretoria de Desenvolvimento Profissional', areas:['Coordenação-Geral de Gestão de Diretrizes de Aprendizagem e Ensino','Coordenação-Geral de Experiências de Aprendizagens Assíncronas','Coordenação-Geral de Desenvolvimento e Execução de Experiências de Aprendizagem Síncronas','Coordenação-Geral de Pós-Graduação Stricto Sensu']},
    {name:'Diretoria de Inovação', areas:['Coordenação-Geral de Gestão do Conhecimento e Comunidades para Inovação','Coordenação-Geral de Inovação Aberta','Coordenação-Geral do Laboratório de Inovação em Governo']},
    {name:'Diretoria de Educação Executiva', areas:['Coordenação-Geral de Especialização e MBA','Coordenação-Geral de Desenvolvimento de Altas Lideranças','Coordenação-Geral de Aperfeiçoamento para Carreiras','Coordenação-Geral de Formação Inicial de Carreiras']},
    {name:'Diretoria de Concursos Públicos', areas:['Coordenação-Geral de Concursos Públicos','Coordenação-Geral de Monitoramento e Integração Logística']}
  ];

  var SECTIONS = [
    {n:1, name:'Área demandante', desc:'Quem está solicitando'},
    {n:2, name:'Projeto', desc:'Objetivo, públicos e prazos'},
    {n:3, name:'Jornalismo', desc:'Atendimento de imprensa'},
    {n:4, name:'Criação / Interna', desc:'Peças e comunicação interna'},
    {n:5, name:'Redes / Audiovisual', desc:'Digital e audiovisual'}
  ];

  function opt(label, value, next){ return {label:label, value:value, next:next}; }

  // ---------- STEP DEFINITIONS ----------
  var STEPS = {};
  function add(s){ STEPS[s.id] = s; }

    options:[opt('Instagram — Avatar','ig-avatar'),opt('Instagram — Destaque','ig-destaque'),opt('Instagram/Facebook — Post Card','post-card'),opt('Instagram/Facebook — Post Foto','post-foto'),opt('Instagram/Facebook — Carrossel Cards','carrossel-cards'),opt('Instagram/Facebook — Carrossel Fotos','carrossel-fotos'),opt('Reels — Capa','reels-capa'),opt('Reels — Vídeo','reels-video'),opt('Stories','stories'),opt('Stories — Moldura','stories-moldura'),opt('Stories — Enquete','stories-enquete'),opt('Stories — Cobertura','stories-cobertura'),opt('Instagram — Sticker','sticker'),opt('Instagram — Collab/Repost','collab'),opt('Instagram — Trends Vídeo','trends-video'),opt('Instagram — Trends Card','trends-card'),opt('Facebook — Capa','fb-capa'),opt('LinkedIn — Avatar','li-avatar'),opt('LinkedIn — Capa','li-capa'),opt('LinkedIn — Banner','li-banner'),opt('LinkedIn — Post Card','li-post-card'),opt('LinkedIn — Carrossel/PDF','li-carrossel'),opt('LinkedIn — Post Fotos','li-post-fotos'),opt('LinkedIn — Vídeo','li-video'),opt('YouTube — Avatar','yt-avatar'),opt('YouTube — Banner','yt-banner'),opt('YouTube — Thumbnail','yt-thumb'),opt('YouTube — Upload','yt-upload'),opt('YouTube — Playlist','yt-playlist'),opt('Spotify — Banner','sp-banner'),opt('Spotify — Avatar','sp-avatar'),opt('Spotify — Thumbnail','sp-thumb'),opt('Spotify — Upload','sp-upload'),opt('Spotify — Playlist','sp-playlist'),opt('SouGov — Card','sg-card'),opt('SouGov — Texto','sg-texto'),opt('WhatsApp — Card','wa-card'),opt('WhatsApp — Texto','wa-texto'),opt('E-mail Marketing — Cabeçalho','em-cabecalho'),opt('E-mail Marketing — Conteúdo','em-conteudo'),opt('E-mail Marketing — Disparo','em-disparo')],
    next:'r15-audiovisual'});
  add({id:'r15-audiovisual', section:5, num:'15.3', title:'Audiovisual — quais peças são necessárias?', type:'checkbox',
    options:[opt('Vídeo — Campanha','v-campanha'),opt('Vídeo — Tutorial','v-tutorial'),opt('Vídeo — Videocast','v-videocast'),opt('Vídeo — Entrevista','v-entrevista'),opt('Vídeo — After movie','v-aftermovie'),opt('Vídeo — Motion design','v-motion'),opt('Vídeo — Roteiro Original','v-roteiro-original'),opt('Vídeo — Roteiro Adaptado','v-roteiro-adaptado'),opt('Vídeo — Captação de imagens','v-captacao'),opt('Vídeo — Roteirização','v-roteirizacao'),opt('Vídeo — Lettering','v-lettering'),opt('Vídeo — Edição','v-edicao'),opt('Áudio — Podcast (Roteiro)','a-podcast-roteiro'),opt('Áudio — Podcast (Captação)','a-podcast-captacao'),opt('Fotos — Retrato','f-retrato'),opt('Fotos — Institucional','f-institucional'),opt('Fotos — Cobertura fotográfica','f-cobertura'),opt('Fotos — Tratamento e colorização','f-tratamento'),opt('Fotos — Flickr (Álbum)','f-flickr')],
    next:'r15-outros'});
  add({id:'r15-outros', section:5, num:'15.4', title:'Outros produtos ou serviços de Redes Sociais/Audiovisual?', type:'textarea', next:'review'});

  // ---------- ENGINE ----------
  var state = { current:'area', answers:{}, history:[], queue:[], submitted:false };

  function saveState(){ try{ sessionStorage.setItem('briefing-ascom-v1', JSON.stringify({answers:state.answers, history:state.history, current:state.current, queue:state.queue, submitted:state.submitted})); }catch(e){} updateProgressUI(); }
  function loadState(){ try{ var raw=sessionStorage.getItem('briefing-ascom-v1'); if(raw){ var d=JSON.parse(raw); state.answers=d.answers||{}; state.history=d.history||[]; state.current=d.current||'area'; state.queue=d.queue||[]; state.submitted=d.submitted||false; } }catch(e){} }

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function resolveNext(step, ans){
    var n = step.next;
    if(typeof n === 'function') return n(ans, state);
    return n;
  }

  function computeOptionNext(step, value){
    var o = (step.options||[]).filter(function(o){return o.value===value;})[0];
    if(o && o.next!==undefined){
      if(typeof o.next === 'function') return o.next(null, state);
      return o.next;
    }
    return null;
  }

  function goTo(id){
    if(state.current) state.history.push(state.current);
    state.current = id;
    saveState();
    renderFlow();
  }

  // Rewind the flow back to a given (already-answered) step so it can be edited.
  // Everything answered after it is dropped from the visible trail — but not erased from
  // state.answers, so retracing the same path later restores what was typed.
  function rewindTo(id){
    var idx = state.history.indexOf(id);
    if(idx===-1) return;
    state.history = state.history.slice(0, idx);
    state.current = id;
    state.submitted = false;
    saveState();
    renderFlow();
  }

  function goBack(){
    if(!state.history.length) return;
    rewindTo(state.history[state.history.length-1]);
  }

  function isAnswered(step, ans){
    if(step.type==='text' || step.type==='textarea') return !!(ans && String(ans).trim());
    if(step.type==='radio') return !!(ans && ans.value!==undefined);
    if(step.type==='checkbox') return !!(ans && ans.values && ans.values.length>0);
    if(step.type==='dynamic-list') return !!(ans && ans.length>0);
    if(step.type==='area') return !!(ans && ans.group && ans.area && ans.nome && ans.email);
    return true;
  }

  function advance(){
    var step = STEPS[state.current];
    if(!step) return;
    var ans = state.answers[step.id];
    if(step.required && !isAnswered(step, ans)){
      showError(true); return;
    }
    showError(false);
    var next;
    if(step.type==='radio' && ans && ans.value!==undefined){
      next = computeOptionNext(step, ans.value);
      if(next===null) next = resolveNext(step, ans);
    } else {
      next = resolveNext(step, ans);
    }
    if(!next){ console.warn('Sem próximo passo definido para', step.id); return; }
    goTo(next);
  }

  function showError(on){
    var el = document.getElementById('errMsg');
    if(el) el.classList.toggle('show', !!on);
  }

  // ---------- RENDER: RAIL ----------
  function renderRail(){
    var wrap = document.getElementById('railSections');
    var step = STEPS[state.current];
    var curSection = state.current==='review' ? 6 : (step ? step.section : 1);
    wrap.innerHTML = SECTIONS.map(function(s){
      var cls = 'rail-sec' + (s.n===curSection?' active':'') + (s.n<curSection?' done':'');
      return '<div class="'+cls+'"><div class="num">'+(s.n<curSection?'✓':s.n)+'</div><div class="txt"><div class="name">'+esc(s.name)+'</div><div class="desc">'+esc(s.desc)+'</div></div></div>';
    }).join('');
  }

  // ---------- RENDER: FIELD TYPES ----------
  function renderOptions(step, multi){
    var ans = state.answers[step.id] || (multi?{values:[]}:{});
    var html = '<div class="opt-grid">';
    (step.options||[]).forEach(function(o, i){
      var selected = multi ? (ans.values||[]).indexOf(o.value)>-1 : ans.value===o.value;
      html += '<label class="opt'+(multi?' checkbox':'')+(selected?' selected':'')+'" data-val="'+esc(o.value)+'">'+
        '<span class="dot"><i></i></span><span>'+esc(o.label)+'</span></label>';
    });
    html += '</div>';
    if(step.other){
      var otherVal = ans.other || '';
      html += '<div class="field other-row"><label>Outros</label><input type="text" id="otherInput" placeholder="Especifique" value="'+esc(otherVal)+'"></div>';
    }
    return html;
  }

  function renderDynList(step){
    var ans = state.answers[step.id] || (state.answers[step.id]=[]);
    var html = '<div class="dyn-list" id="dynList">';
    ans.forEach(function(row, ri){
      html += '<div class="dyn-row" data-i="'+ri+'"><button type="button" class="dyn-remove" data-remove="'+ri+'">×</button><div class="grid">';
      step.fields.forEach(function(f){
        var val = row[f.key]||'';
        if(f.area){
          html += '<div class="field" style="grid-column:1/-1"><label>'+esc(f.label)+'</label><textarea data-row="'+ri+'" data-key="'+f.key+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(val)+'</textarea></div>';
        } else {
          html += '<div class="field"><label>'+esc(f.label)+'</label><input type="text" data-row="'+ri+'" data-key="'+f.key+'" placeholder="'+esc(f.placeholder||'')+'" value="'+esc(val)+'"></div>';
        }
      });
      html += '</div></div>';
    });
    html += '</div><button type="button" class="add-row" id="addRow">+ '+esc(step.addLabel||'Adicionar item')+'</button>';
    return html;
  }

  function renderArea(){
    var ans = state.answers.area || {};
    var groupName = ans.group;
    var html = '<div class="field"><label>Diretoria / Presidência</label><select id="areaGroup"><option value="">Selecione…</option>';
    GROUPS.forEach(function(g){ html += '<option value="'+esc(g.name)+'"'+(g.name===groupName?' selected':'')+'>'+esc(g.name)+'</option>'; });
    html += '</select></div>';
    var group = GROUPS.filter(function(g){return g.name===groupName;})[0];
    html += '<div class="field"><label>Área</label><select id="areaArea"'+(group?'':' disabled')+'><option value="">'+(group?'Selecione…':'Escolha a diretoria primeiro')+'</option>';
    if(group){ group.areas.forEach(function(a){ html += '<option value="'+esc(a)+'"'+(a===ans.area?' selected':'')+'>'+esc(a)+'</option>'; }); }
    html += '</select></div>';
    html += '<div class="field"><label>Nome do responsável</label><input type="text" id="areaNome" value="'+esc(ans.nome||'')+'" placeholder="Nome completo"></div>';
    html += '<div class="field"><label>E-mail do responsável</label><input type="email" id="areaEmail" value="'+esc(ans.email||'')+'" placeholder="nome@enap.gov.br"></div>';
    return html;
  }

  function bindArea(step){
    document.getElementById('areaGroup').addEventListener('change', function(e){
      var a = state.answers.area || (state.answers.area={});
      a.group = e.target.value; a.area='';
      saveState();
      renderFlow({scroll:false});
    });
    var areaSel = document.getElementById('areaArea');
    if(areaSel){ areaSel.addEventListener('change', function(e){
      var a = state.answers.area || (state.answers.area={}); a.area = e.target.value; saveState();
    }); }
    document.getElementById('areaNome').addEventListener('input', function(e){ (state.answers.area||(state.answers.area={})).nome = e.target.value; saveState(); });
    document.getElementById('areaEmail').addEventListener('input', function(e){ (state.answers.area||(state.answers.area={})).email = e.target.value; saveState(); });
  }

  // ---------- ANSWER FORMATTING ----------
  function fmtAnswer(step, ans){
    if(ans===undefined || ans===null || ans==='') return null;
    if(step.type==='text' || step.type==='textarea') return String(ans);
    if(step.type==='radio'){
      var o = (step.options||[]).filter(function(o){return o.value===ans.value;})[0];
      return o ? o.label : null;
    }
    if(step.type==='checkbox'){
      var labels = (ans.values||[]).map(function(v){ var o=(step.options||[]).filter(function(o){return o.value===v;})[0]; return o?o.label:v; });
      if(ans.other) labels.push('Outros: '+ans.other);
      return labels.length ? labels.join(', ') : null;
    }
    if(step.type==='dynamic-list'){
      if(!ans.length) return null;
      return ans.map(function(row){ return step.fields.map(function(f){return row[f.key];}).filter(Boolean).join(' · '); }).join('\n');
    }
    if(step.type==='area'){
      var parts=[];
      if(ans.group) parts.push(ans.group);
      if(ans.area) parts.push(ans.area);
      if(ans.nome) parts.push(ans.nome);
      if(ans.email) parts.push(ans.email);
      return parts.length?parts.join(' · '):null;
    }
    if(step.type==='upload') return null;
    return null;
  }

  // ---------- TIME / PROGRESS ESTIMATE ----------
  // Walks the graph from a given step using the "quickest" choice at every branch
  // (the "Não" option where one exists, otherwise the first option) so we can guess
  // how much is left without knowing the user's future answers.
  var SECONDS_BY_TYPE = { radio:6, checkbox:12, text:14, textarea:32, 'dynamic-list':42, upload:8, note:4, area:24 };

  function defaultNextFor(step, fakeState){
    if(step.type==='radio'){
      var opts = step.options||[];
      if(!opts.length) return typeof step.next==='function' ? step.next(undefined, fakeState) : step.next;
      var noOpt = opts.filter(function(o){ return /^n(ã|a)o$/i.test(o.label); })[0];
      var chosen = noOpt || opts[0];
      if(chosen.next!==undefined){
        return typeof chosen.next==='function' ? chosen.next(null, fakeState) : chosen.next;
      }
      return typeof step.next==='function' ? step.next({value:chosen.value}, fakeState) : step.next;
    }
    if(step.type==='checkbox'){
      var ans = {values:[]};
      return typeof step.next==='function' ? step.next(ans, fakeState) : step.next;
    }
    return typeof step.next==='function' ? step.next(undefined, fakeState) : step.next;
  }

  function estimateRemaining(fromId){
    var steps = 0, seconds = 0;
    var cur = fromId;
    var fakeState = { queue: (state.queue||[]).slice() };
    var guard = 0;
    while(cur && cur!=='review' && guard<200){
      guard++;
      var step = STEPS[cur];
      if(!step) break;
      steps++;
      seconds += SECONDS_BY_TYPE[step.type] || 15;
      var nxt = defaultNextFor(step, fakeState);
      if(!nxt || nxt===cur) break;
      cur = nxt;
    }
    return {steps:steps, seconds:seconds};
  }

  function updateProgressUI(){
    var fillEl = document.getElementById('progressFill');
    var timeEl = document.getElementById('timeEstimate');
    if(!fillEl || !timeEl) return;
    if(state.current==='review'){
      fillEl.style.width = '100%';
      timeEl.textContent = state.submitted ? 'Concluído' : 'Pronto para enviar';
      return;
    }
    var rem = estimateRemaining(state.current);
    var done = state.history.length;
    var total = done + rem.steps;
    var pct = total>0 ? Math.min(96, Math.round(done/total*100)) : 6;
    fillEl.style.width = pct+'%';
    var mins = Math.ceil(rem.seconds/60);
    timeEl.textContent = mins<=1 ? 'menos de 1 min restante' : ('~'+mins+' min restantes');
  }

  // ---------- COMPACT (ANSWERED) CARDS ----------
  function buildCompactCardHtml(step){
    if(step.type==='note'){
      return '<div class="qa-note"><b>Observação —</b> '+esc(step.help||'')+'</div>';
    }
    var val = fmtAnswer(step, state.answers[step.id]);
    return '<div class="qa-card">'+
      '<div class="qa-card-head">'+
        '<div class="qa-card-q"><span class="qa-num mono">'+esc(step.num)+'</span>'+esc(step.title)+'</div>'+
        '<button class="qa-edit" type="button" data-edit="'+esc(step.id)+'">Editar</button>'+
      '</div>'+
      '<div class="qa-a'+(val?'':' empty')+'">'+esc(val||'Não informado')+'</div>'+
    '</div>';
  }

  function bindCompactEdits(){
    document.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ rewindTo(btn.getAttribute('data-edit')); });
    });
  }

  // ---------- ACTIVE (EDITABLE) CARD ----------
  function buildActiveCardHtml(step){
    var body = '';
    body += '<div class="kicker">Item '+esc(step.num)+'</div>';
    body += '<h2 class="q-title">'+esc(step.title)+'</h2>';
    if(step.type==='note'){
      body += '<div class="note-box"><b>Observação —</b> '+esc(step.help||'')+'</div>';
    } else if(step.help){
      body += '<div class="q-help">'+esc(step.help)+'</div>';
    }
    if(step.type==='area'){ body += renderArea(); }
    else if(step.type==='text'){
      var v = state.answers[step.id]||'';
      body += '<div class="field"><input type="text" id="inputMain" value="'+esc(v)+'" placeholder="'+esc(step.placeholder||'Digite aqui…')+'"></div>';
    } else if(step.type==='textarea'){
      var vt = state.answers[step.id]||'';
      body += '<div class="field"><textarea id="inputMain" placeholder="'+esc(step.placeholder||'Digite aqui…')+'">'+esc(vt)+'</textarea></div>';
    } else if(step.type==='radio'){
      body += renderOptions(step, false);
    } else if(step.type==='checkbox'){
      body += renderOptions(step, true);
    } else if(step.type==='dynamic-list'){
      body += renderDynList(step);
    } else if(step.type==='upload'){
      body += '<div class="upload-zone"><span class="ic">＋</span>Arraste arquivos aqui ou clique para selecionar<br><span class="proto">protótipo — upload ilustrativo</span></div>';
    }

    body += '<div class="err-msg" id="errMsg">Essa resposta é necessária para continuar.</div>';
    body += '<div class="actions">'+
      '<button class="btn btn-ghost" id="btnBack" type="button"'+(state.history.length===0?' disabled':'')+'>← Voltar</button>'+
      '<button class="btn btn-primary" id="btnNext" type="button">'+(step.type==='note'?'Continuar':'Avançar →')+'</button>'+
      '</div>';
    return body;
  }

  function bindActiveCard(step){
    var active = document.getElementById('activeCard');
    if(step.type==='area'){ bindArea(step); }
    if(step.type==='text' || step.type==='textarea'){
      document.getElementById('inputMain').addEventListener('input', function(e){ state.answers[step.id]=e.target.value; saveState(); });
    }
    if(step.type==='radio' || step.type==='checkbox'){
      var opts = active.querySelectorAll('.opt');
      opts.forEach(function(el){
        el.addEventListener('click', function(){
          var val = el.getAttribute('data-val');
          if(step.type==='radio'){
            state.answers[step.id] = {value:val};
            opts.forEach(function(o){o.classList.remove('selected');});
            el.classList.add('selected');
          } else {
            var ans = state.answers[step.id] || (state.answers[step.id]={values:[]});
            var idx = ans.values.indexOf(val);
            if(idx>-1){ ans.values.splice(idx,1); el.classList.remove('selected'); }
            else { ans.values.push(val); el.classList.add('selected'); }
          }
          saveState();
        });
      });
      var otherInput = document.getElementById('otherInput');
      if(otherInput){ otherInput.addEventListener('input', function(e){
        var ans = state.answers[step.id] || (state.answers[step.id]={values:[]});
        ans.other = e.target.value; saveState();
      }); }
    }
    if(step.type==='dynamic-list'){
      active.querySelectorAll('[data-row]').forEach(function(el){
        el.addEventListener('input', function(){
          var ri = +el.getAttribute('data-row'), key = el.getAttribute('data-key');
          state.answers[step.id][ri][key] = el.value; saveState();
        });
      });
      active.querySelectorAll('[data-remove]').forEach(function(el){
        el.addEventListener('click', function(){
          var ri = +el.getAttribute('data-remove');
          state.answers[step.id].splice(ri,1); saveState(); renderFlow({scroll:false});
        });
      });
      document.getElementById('addRow').addEventListener('click', function(){
        var row = {}; step.fields.forEach(function(f){row[f.key]='';});
        state.answers[step.id].push(row); saveState(); renderFlow({scroll:false});
      });
    }

    document.getElementById('btnBack').addEventListener('click', goBack);
    document.getElementById('btnNext').addEventListener('click', advance);
  }

  // ---------- REVIEW / SUBMIT CARD ----------
  function buildReviewCardHtml(){
    var html = '';
    if(!state.submitted){
      html += '<div class="kicker">Antes de enviar</div><h2 class="q-title">Tudo pronto?</h2><div class="q-help">Revise as respostas acima — clique em “Editar” em qualquer pergunta para corrigir algo antes de enviar.</div>';
      html += '<div class="actions" style="justify-content:flex-start;gap:14px;"><button class="btn btn-ghost" id="btnBack" type="button">← Voltar</button><button class="btn btn-primary" id="btnSubmit" type="button">Enviar formulário</button></div>';
    } else {
      html += '<div class="kicker">Enviado</div><h2 class="q-title">Tudo certo</h2>';
      html += '<div class="confirm"><span class="ic">✅</span><h3>Formulário enviado</h3><p>A ASCOM/CGCO agradece o envio do formulário de briefing. O responsável pelo atendimento da sua área entrará em contato no próximo dia útil para agendar uma reunião de alinhamento e validação da demanda.</p></div>';
      html += '<div class="actions" style="justify-content:flex-start;"><button class="rail-reset" style="color:var(--accent-strong);border-color:var(--line);" id="btnRestart" type="button">Iniciar novo briefing</button></div>';
    }
    return html;
  }

  function bindReviewCard(){
    var backBtn = document.getElementById('btnBack');
    if(backBtn) backBtn.addEventListener('click', goBack);
    var submitBtn = document.getElementById('btnSubmit');
    if(submitBtn) submitBtn.addEventListener('click', function(){ state.submitted=true; saveState(); renderFlow(); });
    var restartBtn = document.getElementById('btnRestart');
    if(restartBtn) restartBtn.addEventListener('click', resetAll);
  }

  // ---------- MAIN RENDER ----------
  function scrollActiveIntoView(){
    var el = document.getElementById('activeCard');
    if(!el) return;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'start'});
  }

  function renderFlow(opts){
    opts = opts || {};
    var card = document.getElementById('card');
    var html = '';
    state.history.forEach(function(id){
      var step = STEPS[id];
      if(step) html += buildCompactCardHtml(step);
    });

    if(state.current==='review'){
      document.getElementById('crumbSection').textContent = 'Revisão final';
      document.getElementById('crumbBadge').textContent = '✓';
      html += '<div class="qa-active" id="activeCard">' + buildReviewCardHtml() + '</div>';
      card.innerHTML = html;
      bindCompactEdits();
      bindReviewCard();
    } else {
      var step = STEPS[state.current];
      var sectionMeta = SECTIONS[step.section-1];
      document.getElementById('crumbSection').textContent = 'Seção '+step.section+' · '+sectionMeta.name;
      document.getElementById('crumbBadge').textContent = step.num;
      html += '<div class="qa-active" id="activeCard">' + buildActiveCardHtml(step) + '</div>';
      card.innerHTML = html;
      bindCompactEdits();
      bindActiveCard(step);
    }

    renderRail();
    updateProgressUI();
    if(opts.scroll !== false) scrollActiveIntoView();
  }

  function render(){ renderFlow(); }

  function resetAll(){
    state = { current:'area', answers:{}, history:[], queue:[], submitted:false };
    try{ sessionStorage.removeItem('briefing-ascom-v1'); }catch(e){}
    render();
    window.scrollTo(0,0);
  }

  document.getElementById('resetBtn').addEventListener('click', resetAll);
  document.getElementById('mobileToggle').addEventListener('click', function(){
    document.getElementById('rail').classList.toggle('rail-open');
  });

  loadState();
  render();
})();
</script>
